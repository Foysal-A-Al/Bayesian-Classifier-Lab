name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q
      - name: Run documented synthetic demo
        run: |
          python scripts/generate_example_data.py
          bayesclf --config config.demo.yml
      - name: Check demo outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          root = Path("results/demo")
          scores = pd.read_csv(root / "fold_scores.csv")
          pairs = pd.read_csv(root / "bayesian_accuracy.csv")
          assert len(scores) == 30
          assert len(pairs) == 10
          assert len(list((root / "posterior_plots_accuracy").glob("*.png"))) == 10
          assert np.allclose(pairs[["p_A_better", "p_equivalent", "p_B_better"]].sum(axis=1), 1)
          PY
